<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f8">
  <meta name="api-base-url" content="http://127.0.0.1:8000">
  <title>登录 · 行序</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23273732'/%3E%3Cpath d='M8 10h16M8 16h10M8 22h16' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
  <script defer src="auth-session.js"></script>
  <script defer src="auth.js"></script>
</head>
<body class="auth-page">
  <header class="auth-header">
    <a class="brand" href="auth.html" aria-label="行序账号首页"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>行序<span class="brand-sub">数据处理工作台</span></span></a>
    <a class="auth-preview-link" href="index.html?preview=1">预览工作台<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></a>
  </header>

  <main class="auth-main">
    <section class="auth-card" aria-labelledby="auth-title">
      <div class="auth-intro"><span class="auth-eyebrow">账号入口</span><h1 id="auth-title">欢迎回来</h1><p id="auth-description">登录后，管理你的数据文件与处理任务。</p></div>
      <div class="auth-tabs" role="tablist" aria-label="账号操作">
        <button id="login-tab" class="auth-tab active" type="button" role="tab" aria-selected="true" aria-controls="auth-panel" tabindex="0" data-mode="login">登录</button>
        <button id="register-tab" class="auth-tab" type="button" role="tab" aria-selected="false" aria-controls="auth-panel" tabindex="-1" data-mode="register">注册</button>
      </div>

      <div id="auth-panel" role="tabpanel" aria-labelledby="login-tab">
        <form id="auth-form" class="auth-form" method="post" novalidate>
          <div class="auth-field"><label for="account">账号</label><input id="account" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="请输入账号" aria-describedby="account-feedback"><p id="account-feedback" class="auth-field-error" aria-live="polite" hidden></p></div>
          <div class="auth-field"><label for="password">密码</label><div class="password-input"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" aria-describedby="password-hint password-feedback"><button class="password-toggle" type="button" data-password="password" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/><path class="eye-slash" d="m4 4 16 16"/></svg></button></div><p id="password-hint" class="auth-field-hint" hidden>8～128 个字符，可使用中文、字母、数字、符号和空格；避免常见弱密码。</p><p id="password-feedback" class="auth-field-error" aria-live="polite" hidden></p></div>
          <div class="auth-field" id="confirm-field" hidden><label for="confirm-password">确认密码</label><div class="password-input"><input id="confirm-password" name="password_confirmation" type="password" autocomplete="new-password" placeholder="请再次输入密码" aria-describedby="confirmation-feedback" disabled><button class="password-toggle" type="button" data-password="confirm-password" aria-label="显示确认密码" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/><path class="eye-slash" d="m4 4 16 16"/></svg></button></div><p id="confirmation-feedback" class="auth-field-error" aria-live="polite" hidden></p></div>
          <button id="auth-submit" class="auth-submit" type="submit" disabled>登录</button>
          <p id="auth-feedback" class="auth-feedback" role="status" aria-live="polite" hidden></p>
        </form>
        <p class="auth-switch-prompt"><span id="switch-description">还没有账号？</span><button id="switch-mode" type="button">注册账号</button></p>
      </div>

      <div class="auth-prototype-note"><span class="small-dot"></span><span>使用你的账号登录，或注册一个新账号。</span></div>
    </section>
  </main>

  <footer class="auth-footer"><span>行序 · 数据处理工作台</span><span>界面预览 v0.1</span></footer>
</body>
</html>
